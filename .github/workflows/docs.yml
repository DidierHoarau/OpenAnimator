name: Docs

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "scripts/**"
      - "src/shared/scripting/**"
      - "src/cli/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The docs build never launches Electron: skip the binary download.
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Build docs site
        run: npm run docs:build

      # `enablement: true` turns Pages on (build type: workflow) on the first
      # run; afterwards it is a no-op. If the repository does not allow the
      # workflow token to enable Pages, warn loudly and skip the deploy rather
      # than failing every docs change.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - name: Warn when GitHub Pages is unavailable
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning title=Deploy skipped: GitHub Pages is not enabled::The docs site was built but not deployed because GitHub Pages is not enabled and this token cannot enable it. A repository admin must enable it under Settings -> Pages -> Source: GitHub Actions (or grant the token the Pages: write permission); the next push to main then deploys automatically."

      - name: Upload site
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
