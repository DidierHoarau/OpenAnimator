appId: io.github.didierhoarau.openanimator
productName: OpenAnimator
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
# electron-updater provider; with `--publish never` this only generates the
# latest*.yml metadata and the in-app resources/app-update.yml (no upload).
publish:
  provider: github
  owner: DidierHoarau
  repo: OpenAnimator
fileAssociations:
  - ext: oanim
    name: OpenAnimator Project
    description: OpenAnimator vector animation project
    # Required for the Linux .desktop MimeType entry and mime-info (deb/rpm/Flatpak).
    mimeType: application/x-oanim
    role: Editor
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.graphics-design
  # Explicit unsigned build (no signing certificate on the runners).
  identity: null
linux:
  icon: build/icon.png
  category: Graphics
  syncDesktopName: true
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
    - target: flatpak
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
flatpak:
  # Defaults are 20.08, too old for current Electron; the runtime must match
  # the base app version published on Flathub.
  runtimeVersion: "24.08"
  baseVersion: "24.08"
